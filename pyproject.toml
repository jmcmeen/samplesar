[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "samplesar"
dynamic = ["version"]
authors = [
  { name="John McMeen", email="johnmcmeen@gmail.com" },
]
description = "Species-area relationship datasets from geometric sampling of point observations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

dependencies = [
  "numpy>=1.23.2",
  "pandas>=1.5",
  "shapely>=2.0",
  "sars>=0.7.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov",
  "pytest-xdist[psutil]",
  "mypy",
  "pandas-stubs",
  "ruff>=0.17,<0.18",  # pinned: minor releases change formatting; upgrade on purpose
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]",
]

[project.urls]
Homepage = "https://github.com/jmcmeen/samplesar"
Source = "https://github.com/jmcmeen/samplesar"
Changelog = "https://github.com/jmcmeen/samplesar/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/jmcmeen/samplesar/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/samplesar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--tb=short",
  "--strict-markers",
  # -n logical, not auto: auto counts physical cores, 2 on CI's 4-vCPU runners.
  "-n", "logical",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/samplesar"]

[tool.mypy]
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# No type information published for these.
module = ["shapely.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
  "C901",   # too complex
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["samplesar"]
