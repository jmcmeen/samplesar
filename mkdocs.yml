site_name: samplesar
site_description: Species-area relationship datasets from geometric sampling of point observations
site_url: https://jmcmeen.github.io/samplesar/
repo_url: https://github.com/jmcmeen/samplesar
repo_name: jmcmeen/samplesar

theme:
  name: material
  # Light or dark to match the reader's system setting, with a toggle in the header.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - tables

plugins:
  - search
  - mkdocs-jupyter:
      # Notebooks are committed executed; the build renders their stored outputs.
      execute: false
      include_source: true
      ignore_h1_titles: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            heading_level: 3
            docstring_style: numpy
            members_order: source
            group_by_category: false
            show_signature_annotations: true
            separate_signature: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Sampling Strategies: strategies.md
  - Regions as Sampling Units: islands.md
  - Patches as Sampling Units: quadrats.md
  - Examples:
      - A first nest: examples/first_nest.ipynb
      - Comparing strategies: examples/strategies.ipynb
      - Regions as islands: examples/islands.ipynb
  - API Reference:
      - Samples and nests: api/core.md
      - Sources: api/sources.md
      - Regions: api/regions.md
      - Strategies: api/strategies.md
      - Designs: api/designs.md
      - Evaluation: api/evaluate.md
      - Plotting: api/plot.md

exclude_docs: |
  assets/*.py
