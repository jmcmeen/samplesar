name: Docs

# Builds the MkDocs site and deploys it to GitHub Pages.
# Enable once: repo Settings → Pages → Build and deployment → Source = "GitHub Actions",
# and let release tags deploy: Settings → Environments → github-pages → Deployment
# branches and tags → add a tag rule "v*" (the environment GitHub creates allows
# only main, and release.yml runs this workflow on the tag).

on:
  # Run by release.yml on the new tag, so the site matches the latest release
  # (a merge to main alone doesn't redeploy it). Also by hand, on main or a
  # release tag: the github-pages environment refuses other refs.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history + tags for hatch-vcs versioning

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The locked versions, as the CI docs job builds on pull requests.
      - name: Build (mkdocstrings analyzes source statically)
        run: uv run --frozen --extra docs mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
